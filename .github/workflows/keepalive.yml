# Supabase 무료 플랜이 "일주일 동안 사용 없음"으로 멈추지 않게,
# 하루 한 번 공개 예약 현황(public_board)을 읽기만 합니다.
# 예약·데이터를 만들거나 바꾸지 않습니다. 공개용 주소·공개용(Publishable) 키만 씁니다.
# 저장소에 60일 동안 변경이 없으면 GitHub가 이 작업을 멈출 수 있습니다
# → 저장소 Actions 탭 > "Supabase keepalive" > Enable workflow 로 다시 켭니다.
name: Supabase keepalive

on:
  schedule:
    - cron: "23 15 * * *"   # 매일 00:23 (서울 시각)
  workflow_dispatch: {}      # Actions 탭에서 직접 실행 가능

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 공개 예약 현황 한 번 읽기
        env:
          SUPABASE_URL: https://ibcvbnpqmlqmdwxkepbl.supabase.co
          SUPABASE_KEY: sb_publishable_EuDlhpMAm69J4qB0pMFVYA_bh5RWzo2
        run: |
          code=$(curl -sS -o body.json -w "%{http_code}" --retry 3 --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/public_board" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}')
          echo "응답 코드: $code (응답 크기: $(wc -c < body.json) 바이트)"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase가 응답하지 않습니다(코드 $code). 프로젝트가 멈췄다면 Supabase 대시보드에서 Resume project를 누르십시오."
            exit 1
          fi
