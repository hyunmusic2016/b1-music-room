<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>음악 연습실 예약 페이지 ・ 현실용음악학원</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{
  --bg:#f6f4ef;--surface:#fff;--ink:#1d1b2e;--sub:#6b6880;--line:#dcd8cf;
  --accent:#A0C6E9;--accent-strong:#5b95cc;--accent-text:#2d6596;--accent-ink:#14304d;--ext-text:#9C5238;--ext-btn:#9C5238;--ext-line:#9C5238;--ext-ink:#fff;--stu-text:#0a6f72;--stu-btn:#0e9194;--brass:#a9741a;--brass-bg:#f6e9cf;--cnt:#85590f;--cnt-bg:#f6e9cf;--flat:#85590f;
  --free:#fff;--taken:#e9e6df;--past:#efede8;--danger:#b3261e;--ok:#1f6b45;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14131f;--surface:#1e1d2d;--ink:#f0eee8;--sub:#a29fb8;--line:#34324a;
  --accent:#A0C6E9;--accent-strong:#A0C6E9;--accent-text:#A0C6E9;--accent-ink:#14304d;--stu-text:#5fd4d6;--ext-text:#e0a48c;--ext-line:#e0a48c;--brass:#e0a94d;--brass-bg:#3a2f18;--cnt:#e0a94d;--cnt-bg:#3a2f18;--flat:#e0a94d;
  --free:#1e1d2d;--taken:#2a2940;--past:#191827;--danger:#ff8a80;--ok:#7fd6a4;}}
:root[data-theme="dark"]{
  --bg:#14131f;--surface:#1e1d2d;--ink:#f0eee8;--sub:#a29fb8;--line:#34324a;
  --accent:#A0C6E9;--accent-strong:#A0C6E9;--accent-text:#A0C6E9;--accent-ink:#14304d;--stu-text:#5fd4d6;--ext-text:#e0a48c;--ext-line:#e0a48c;--brass:#e0a94d;--brass-bg:#3a2f18;--cnt:#e0a94d;--cnt-bg:#3a2f18;--flat:#e0a94d;
  --free:#1e1d2d;--taken:#2a2940;--past:#191827;--danger:#ff8a80;--ok:#7fd6a4;}
/* "내일" 색(오늘은 브랜드 하늘색 그대로). .tmr 안에서는 강조색을 보라로 바꿉니다: 바탕 #CDBFF2, 그 위 글씨 #241a52, 테두리·밑줄 #7a6bd1, 글자 #5446ad */
.tmr{--accent:#CDBFF2;--accent-strong:#7a6bd1;--accent-text:#5446ad;--accent-ink:#241a52}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tmr{--accent:#CDBFF2;--accent-strong:#CDBFF2;--accent-text:#CDBFF2;--accent-ink:#241a52}}
:root[data-theme="dark"] .tmr{--accent:#CDBFF2;--accent-strong:#CDBFF2;--accent-text:#CDBFF2;--accent-ink:#241a52}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);word-break:keep-all;overflow-wrap:break-word;font:16px/1.5 "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
button,input,select,textarea{font-family:inherit}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom,0px))}
h1{font-size:26px;font-weight:900;letter-spacing:-.02em;margin:8px 0 2px}
h2{font-size:18px;font-weight:700;margin:20px 0 8px}
.banner{background:var(--brass-bg);color:var(--ink);border-left:4px solid var(--brass);padding:10px 12px;border-radius:6px;font-size:14px;margin:10px 0}
.tabs{display:flex;gap:8px;margin:12px 0}
.tab{flex:1;min-height:52px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
.tab small{display:block;font-weight:400;color:var(--sub);font-size:12px}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] small{color:inherit;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:400px){.grid{grid-template-columns:repeat(3,1fr)}}
.slot{min-height:64px;border:1.5px solid var(--line);border-radius:10px;background:var(--free);color:var(--ink);font:inherit;text-align:left;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:2px}
.slot b{font-size:15px}
.slot span{font-size:13px}
.slot.free{border-color:var(--accent-strong)}
.slot.free span{color:var(--accent-text);font-weight:700}
.slot.taken{background:var(--taken);cursor:not-allowed}
.slot.taken.stu span{color:var(--stu-text);font-weight:700}
.slot.taken.ext span{color:var(--ext-text);font-weight:700}
.lg{display:inline-flex;align-items:center;gap:5px;font-weight:700}
.lg.stu{color:var(--stu-text)}
.lg.ext{color:var(--ext-text)}
.slot.past{background:var(--past);color:var(--sub);cursor:not-allowed}
.slot.blocked{background:repeating-linear-gradient(135deg,var(--past),var(--past) 6px,var(--taken) 6px,var(--taken) 12px);cursor:not-allowed}
.badge{display:inline-block;background:var(--brass-bg);color:var(--brass);border:1px solid var(--brass);border-radius:999px;font-size:11px;padding:0 7px;font-weight:700;margin-left:4px}
.badge.flat{color:var(--flat);border-color:var(--flat)}
.badge.count{background:var(--cnt-bg);color:var(--cnt);border-color:var(--cnt)}
.legend .badge{margin-left:0}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--sub);margin:10px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
label{display:block;font-weight:700;font-size:14px;margin:16px 0 8px}
input[type=text],input[type=password],input[type=email],input[type=search],input[type=tel],input[type=number],input[type=date],textarea{width:100%;font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent-strong);outline-offset:2px}
.hint{font-size:13px;color:var(--sub);margin:4px 0 0}
.endrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.endrow .btn{flex:none}
.endtxt{font-size:16px;font-weight:700;color:var(--ink);margin:0}
.pcalc{text-align:right;margin:6px 0 0;font-size:15px;color:var(--ink);min-height:0}.pcalc:empty{display:none}.pcalc b{font-size:18px;font-weight:800}.pcalc .pc-l{font-size:13px;color:var(--sub)}.pcalc .pc-no{font-size:12.5px;color:var(--sub)}
.hint.warn{color:var(--brass);font-weight:500}
.pwnote{display:flex;gap:10px;align-items:center;margin:10px 0 0;padding:11px 13px;border:2px solid var(--stu-btn);border-radius:12px;background:color-mix(in srgb,var(--stu-btn) 10%,transparent)}
.pwnote .pwk{font-size:22px;line-height:1}
.pwnote b{display:block;font-size:15.5px;color:var(--stu-text);line-height:1.4}
.pwnote span:not(.pwk){display:block;font-size:13.5px;color:var(--ink);margin-top:2px}
.pline+.pline{margin-top:6px}
.kslot{margin-top:10px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.kslot.flat{border-left:5px solid var(--flat)}.kslot.count{border-left:5px solid var(--cnt)}
.kshead{display:flex;align-items:center;margin-bottom:8px}
  background:repeating-linear-gradient(135deg,var(--bg) 0 8px,var(--line) 8px 10px)}
.stuchk{display:flex;gap:8px;align-items:flex-start;margin:6px 0 6px;padding:9px 12px;border-radius:10px;font-size:13.5px;line-height:1.5;color:var(--ink)}
.stuchk .ic{flex:none;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;margin-top:1px}
.stuchk.ok{border:1.5px solid var(--stu-btn);background:color-mix(in srgb,var(--stu-btn) 9%,transparent)}
.stuchk.ok .ic{background:var(--stu-btn)}.stuchk.ok b{color:var(--stu-text)}
.stuchk.no{border:1.5px solid var(--danger);background:color-mix(in srgb,var(--danger) 8%,transparent)}
.stuchk.no .ic{background:var(--danger)}.stuchk.no b{color:var(--danger)}
.rtag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;border:1px solid var(--stu-btn);color:var(--stu-text);vertical-align:1px;white-space:nowrap}
.pwnote small{display:block;font-size:12px;color:var(--sub);margin-top:4px}
.btn{min-height:50px;width:100%;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;cursor:pointer;margin-top:14px}
.btn.ext{background:var(--ext-btn);color:var(--ext-ink)}
.btn.stu{background:var(--stu-btn);color:#fff}
.btn.call{background:#1e8e4e;color:#fff}
details.hist{border:1px solid var(--line);border-radius:12px;padding:0 14px;margin-top:12px;background:var(--surface)}
details.hist>summary{list-style:none;cursor:pointer;min-height:50px;display:flex;align-items:center;gap:6px;font-weight:700}
details.hist>summary::-webkit-details-marker{display:none}
details.hist>summary small{font-weight:400;color:var(--sub)}
details.hist>summary::after{content:"펼치기 ▾";margin-left:auto;font-size:13px;font-weight:500;color:var(--accent-text)}
details.hist[open]>summary::after{content:"접기 ▴"}
details.hist[open]{padding-bottom:8px}
details.hist .item b{font-size:15px}
.ro{min-height:48px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);overflow-wrap:anywhere}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-child{border-top:0}.kv span{color:var(--sub)}.kv b{text-align:right}
.uitem{cursor:pointer}.uitem:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.uitem .chev{font-size:22px;color:var(--sub);line-height:1;padding-left:2px}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
.btn.first{background:transparent;color:var(--ext-text);border:1.5px solid var(--ext-line);margin-top:14px}
.steps{padding-left:22px;margin:12px 0 4px}
.steps li{margin:10px 0;font-size:15px;line-height:1.6}
.sh-kind{font-size:15px;font-weight:700;margin:0 0 2px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.danger{color:#3b0d0a}}
:root[data-theme="dark"] .btn.danger{color:#3b0d0a}
.btn.violet{background:#6b3fa0;color:#fff} /* 블랙리스트 등록(v0.21.0) */
.badge.black{background:transparent;color:#6b3fa0;border-color:#6b3fa0}
.badge.black.hist{border-style:dashed}
textarea{resize:vertical;line-height:1.5;margin-bottom:8px} /* 지금은 아니지만 전에 블랙리스트였던 이용자(관리자 화면에만) */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.black{color:#c9a8f0;border-color:#c9a8f0}}
:root[data-theme="dark"] .badge.black{color:#c9a8f0;border-color:#c9a8f0}
.btn.edit{background:#f5c518;color:#3d2e00}
.cardgroup{border:1.5px solid var(--line);border-radius:16px;padding:4px 10px;background:var(--line-soft,rgba(120,110,90,.07));margin:10px 0} /* 이용자 수정: 정보·상품·저장 상자를 큰 상자로 묶음(v0.21.11) */
.card.blackbox,.card.farbox{margin-top:40px} /* 블랙리스트는 묶음 상자와 간격을 두어 떨어뜨림 */
.btn2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* 이용료 변경의 상품 한 줄: 총 [N]시간 · [가격]원 [✕] (v0.26.0) */
.prow{display:flex;align-items:center;gap:6px;margin:8px 0;white-space:nowrap}
.prow input{margin:0;padding:10px 8px}
.prow .pn{width:58px;flex:none;text-align:center}
.prow .pp{flex:1;min-width:0;text-align:right}
.prow .pdel{flex:none;width:44px;min-height:44px;margin:0;padding:0}
.pexp{font-size:13.5px;color:var(--sub);margin:0 0 6px;line-height:1.6}
/* "예약은 1시간 단위" 강조(v0.26.1) */
.onehr{border:1.5px solid var(--accent-strong);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:7px 10px;margin:8px 0;text-align:center}
.onehr b{display:block;font-size:15px;font-weight:800}
.onehr span{display:block;font-size:12px;margin-top:1px}
.plwho{margin:10px 0 0}.plwho+.plwho{margin-top:22px}
.plwhot{font-size:16px;font-weight:800;margin-bottom:2px}.plwhot small{display:block;font-size:12px;font-weight:600;margin-top:2px}
.plwhot+.plrow{border-top:0}
.plsubt{font-size:16px;font-weight:800;margin:12px 4px 0}
.plexpt{font-size:16px;font-weight:800;margin:26px 4px 0;padding-top:14px;border-top:1px dashed var(--line)}
.plrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px solid var(--line);padding:10px 0}
.plrow:first-of-type{border-top:0}
.plrow b{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.plrow.pick{width:100%;background:none;border:0;border-top:1px solid var(--line);font:inherit;color:var(--ink);text-align:left;cursor:pointer;border-radius:8px;padding:10px 6px}
.plrow.pick:first-of-type{border-top:0}
.plrow.pick:hover:not(:disabled),.plrow.pick:focus-visible{background:var(--line)}
.plrow.pick:disabled{opacity:.45;cursor:not-allowed}
.pickgo{color:var(--accent-text);font-weight:900;margin-left:4px}
.badge.big{font-size:14px;padding:3px 12px} /* 이용료 안내 창의 이용권 배지(v0.34.1) */
.stuonly{text-align:center;border:2px solid var(--stu-btn);color:var(--stu-text);border-radius:10px;padding:8px 10px;margin:8px 0 2px;font-size:14px;font-weight:700;line-height:1.5}
.rbox{border:1.5px dashed var(--accent-strong);border-radius:10px;padding:10px 12px;margin:10px 0 2px;font-size:14px} /* 재원생 명부 연결(v0.36.0) */
.rbox .rtitle{font-weight:700;margin-bottom:4px}
.tokenbox{font-family:ui-monospace,Menlo,monospace;font-size:14px;word-break:break-all;background:var(--line);border-radius:8px;padding:10px;margin:8px 0}
.hr1{display:inline-block;border-radius:6px;padding:0 6px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:12.5px;margin-left:4px;vertical-align:1px}
.btn2 .btn{margin:0} /* 모든 [수정] 버튼은 개나리색으로 통일합니다. */
.btn.small{min-height:40px;width:auto;padding:0 14px;margin:0;white-space:nowrap;flex:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.msg{padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14px}
.msg.err{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.msg.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.msg.warn{background:color-mix(in srgb,var(--flat) 14%,transparent);color:var(--flat);font-weight:600} /* 상품 기간이 끝난 날짜 예약 안내(v0.21.15) */
.check{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:13px;font-weight:400}
.check input{width:22px;height:22px;margin:0;flex:none}
/* 제목 줄 오른쪽 작은 버튼: 예약 화면에서는 "내 예약", 그 밖의 화면에서는 "예약하기" */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 16px}
.topbar h1{margin:0;display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap}
@media (max-width:380px){.topbar h1{font-size:23px;gap:6px}}
.hlogo{height:2.05em;width:auto;display:block;flex:none} /* 제목 두 줄 높이에 맞춘 학원 로고(v0.52.1) */
.htxt{display:flex;flex-direction:column;justify-content:center}
.h1a{font-size:.66em;line-height:1.2;font-weight:800;letter-spacing:-.01em}
.h1b{line-height:1.15}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hlogo{filter:invert(1) hue-rotate(180deg)}}
:root[data-theme="dark"] .hlogo{filter:invert(1) hue-rotate(180deg)}
.topbtn{display:inline-flex;align-items:center;gap:6px;flex:none;min-height:44px;padding:0 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;font-weight:700;white-space:nowrap;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.topbtn svg{width:18px;height:18px;flex:none;color:var(--accent-text)}
.sheet-bg{position:fixed;inset:0;padding:16px;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:10}
.sheet-bg.open{display:flex}
/* 다른 페이지(아임웹) 안에 넣었을 때: 창 위치를 스크립트가 "보이는 부분"에 맞춥니다(placeSheet) */
.embed .sheet-bg{align-items:flex-start}
/* 예약 방식 선택·입력 창: "오늘/내일" 글자와 창 테두리를 그날 색으로(오늘 하늘, 내일 보라 — .tmr이면 보라 변수) */
.sheet.daycol{border:4px solid var(--accent-strong)}
.dayw{color:var(--accent-text)}
/* 관리자 예약 화면 맨 위 경고 띠(빨강) */
.admin-warn{display:flex;gap:10px;align-items:center;justify-content:center;text-align:center;border:2px solid var(--danger);background:var(--surface);background:color-mix(in srgb,var(--danger) 12%,var(--surface));color:var(--danger);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.admin-warn b{font-size:18px;font-weight:400;display:block}
.admin-warn small{display:block;font-size:13px;color:var(--ink);opacity:.85;margin-top:2px}
.admin-warn svg{flex:none;width:28px;height:28px}
/* 관리자 지난 예약·취소된 예약: 날짜별 묶음 + 한 줄 요약(v0.16.9) */
.dgrp{margin-top:10px}
.dgrp-h{display:flex;gap:8px;align-items:center;background:var(--bg);border-radius:8px;padding:0 10px;min-height:40px;font-size:14px;font-weight:800;list-style:none;cursor:pointer}
.dgrp-h::-webkit-details-marker{display:none}
.dgrp-h small{font-weight:400;color:var(--sub);margin-left:auto}
.dgrp-h::after{content:"▾";color:var(--accent-text);font-size:13px}
details.dgrp[open]>.dgrp-h::after{content:"▴"}
.cdate{text-align:center;font-size:12px;color:var(--sub);margin:8px 0 0;line-height:1.5}.cdate b{color:var(--ink);font-size:inherit}
.codes{border:1px solid var(--line);border-radius:12px;padding:8px 10px 10px;margin:12px 0 0;background:var(--bg)}
.codes>b{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:6px;text-align:center}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.crow{text-align:center;min-width:0}
.crow span{display:block;font-size:12px;color:var(--sub)}
.crow b{display:block;font-size:16px;font-weight:800;letter-spacing:.04em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function addDays(ds,n){const [y,m,d]=ds.split("-").map(Number);const t=new Date(Date.UTC(y,m-1,d+n));return t.toISOString().slice(0,10)}
function dateLabel(ds){const [y,m,d]=ds.split("-").map(Number);return m+"월 "+d+"일 ("+DAYS_KO[new Date(Date.UTC(y,m-1,d)).getUTCDay()]+")"}
function hourLabel(h){return String(h).padStart(2,"0")+":00–"+String(h+1).padStart(2,"0")+":00"}
function norm(n){return n.replace(/\s+/g,"")}
function validName(n){return /^[가-힣]{2,5}$/.test(n)||/^[A-Za-z]{2,20}$/.test(n)}
function fmtPhone(v){
  const d=String(v||"").replace(/\D/g,"");
  if(!/^01\d{8,9}$/.test(d))return null;
  return d.length===11?d.replace(/(\d{3})(\d{4})(\d{4})/,"$1-$2-$3"):d.replace(/(\d{3})(\d{3})(\d{4})/,"$1-$2-$3");
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){}
  try{const ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;top:0;left:0;opacity:0";document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);const ok=document.execCommand("copy");ta.remove();return ok}catch(e){return false}
}
function tgtLabel(t){return t==="ext"?"일반회원":"재원생"}
function periodEnd(start,days){return addDays(start,days-1)} // 종료일 = 시작일 + 일수 − 1일
function spanDays(start,end){return Math.round((Date.parse(end)-Date.parse(start))/864e5)+1} // 시작일~종료일 일수(양 끝 포함)
function periodText(start,days){return "종료일: "+periodEnd(start,days)+" ("+days+"일)"}

/* 서버 함수 호출. 성공·실패 모두 {ok, msg, ...} 모양으로 돌려줍니다(public_board, is_admin은 결과 그대로). */
/* "관리자에게 문의하십시오"·"학원에 문의하십시오" 안내 뒤에는 전화번호 대신 "(홈 화면 맨 아래 [관리자 문의])"를 붙임(v0.44.0, 사용자 요청: 전화번호는 문의 가능 시간과 함께 한 곳에만).
   서버 문구의 "처음 이용하시는 경우 010-…으로 연락하시기 바랍니다."도 여기서 바꿈 */
function withAsk(m){m=String(m).replace(/처음 이용하시는 경우 [0-9-]+으로 연락하시기 바랍니다\./g,"처음 이용하시는 경우 "+ASK_WHERE+"에서 문의 가능 시간을 확인하신 뒤 연락하십시오.");return m.includes(ASK_WHERE)?m:m.replace(/((관리자에게|학원에|학원으로) [^.]*?문의하십시오\.)/g,"$1 ("+ASK_WHERE+")")}
/* v0.53.0: 정액권은 없어짐(서버 048). 서버가 옛 정액권 자료(만료된 기록·예약의 상품 종류 등)를 주더라도 화면에 들어오기 전에 버립니다. */
function noFlat(v){
  if(Array.isArray(v))return v.filter(x=>!(x&&typeof x==="object"&&x.kind==="flat")).map(noFlat);
  if(v&&typeof v==="object")for(const k of Object.keys(v)){const x=v[k];
    if(k==="ext_flat"||k==="stu_flat"){delete v[k];continue}
    if(x&&typeof x==="object"&&!Array.isArray(x)&&x.kind==="flat"){v[k]=null;continue}
    if(Array.isArray(x))v[k]=noFlat(x);else noFlat(x)}
  return v;
}
/* v0.54.0: "횟수"라는 말을 쓰지 않음(서버 049). 049 실행 전 서버가 옛 문구를 주더라도 시간 문구로 바꿔 보여 줌 */
function hoursMsg(m){return String(m).replace(/횟수권/g,"이용권")
  .replace(/하루에 한 번만 예약할 수 있습니다/g,"하루 1시간만 예약할 수 있습니다").replace(/(\d+)회를 모두 사용했습니다/g,"$1시간을 모두 사용했습니다")
  .replace(/횟수를 늘리거나/g,"시간을 늘리거나").replace(/(\d+)회 사용했습니다\. 총 이용 횟수는 (\d+)회 이상/g,"$1시간 사용했습니다. 총 이용 시간은 $2시간 이상")
  .replace(/총 이용 횟수/g,"총 이용 시간").replace(/번째 줄: 횟수를/g,"번째 줄: 시간을").replace(/1회 이용료/g,"1시간 이용료")}
async function rpc(fn,args){
  if(!sb)return {ok:false,msg:NET_MSG};
  try{
    const {data,error}=await sb.rpc(fn,args||{});
    if(error){
      console.error(fn,error);
      if(error.code==="42501"||/jwt/i.test(error.message||""))return {ok:false,msg:"권한이 없습니다. 관리자라면 다시 로그인하십시오.",auth:true};
      return {ok:false,msg:NET_MSG};
    }
    if(data&&data.ok===false&&data.msg==="관리자 로그인이 필요합니다.")data.auth=true;
    noFlat(data);
    if(data&&typeof data.msg==="string")data.msg=withAsk(hoursMsg(data.msg));
    if(data&&Array.isArray(data.options))data.options.forEach(o=>{if(o&&typeof o.why==="string")o.why=withAsk(o.why)});
    return data;
  }catch(e){console.error(fn,e);return {ok:false,msg:NET_MSG}}
}
/* 서버 시각(서울). "오늘·내일"은 휴대폰 시계가 아니라 서버가 알려 준 날짜로 판단합니다. */
const SV={today:null,dates:[]};
function seoulDate(){return SV.today||new Date(Date.now()+9*36e5).toISOString().slice(0,10)}
function allowedDates(){return SV.dates.length?SV.dates:[seoulDate(),addDays(seoulDate(),1)]}
function setServerNow(now){if(!now)return;const t=String(now).slice(0,10);if(t!==SV.today){SV.today=t;SV.dates=[t,addDays(t,1)]}}

/* 예약 현황(오늘·내일, 가린 이름만) */
let board=null,boardSeq=0;
async function loadBoard(){ // 여러 번 불러도 가장 나중에 요청한 결과만 씁니다(늦게 온 옛 결과 무시).
  const my=++boardSeq,b=await rpc("public_board");
  if(!(b&&Array.isArray(b.slots)))return false;
  if(my===boardSeq){board=b;setServerNow(b.now)}
  return true;
}
function slotsFor(d){return board?board.slots.filter(s=>s.date===d):[]}

/* ===== 이용권(서버가 준 상품 정보, 코드 값 count) =====
   상품: {id, kind, target, start, end, total, used, left:{total}} */
function leftText(q){const t=seoulDate();if(q.start>t)return "시작 예정";const n=spanDays(t,q.end);return n<=0?"기간 종료":n===1?"1일 남음(오늘까지)":n+"일 남음"}
/* 상품 기간이 7일 안에 끝나면 미리 안내(v0.35.0, 사용자 요청): 예약 창·내 예약. 시작 전 상품은 안내하지 않음. */
const SOON_DAYS=7;
function mdw(ds){const [y,m,d]=ds.split("-").map(Number);return m+"/"+d+"("+DAYS_KO[new Date(Date.UTC(y,m-1,d)).getUTCDay()]+")"}
function soonHtml(q){
  if(!q)return "";const t=seoulDate();if(q.start>t)return "";
  const n=spanDays(t,q.end);if(n<1||n>SOON_DAYS)return "";
  return '<div class="msg warn" style="margin:8px 0 0;text-align:left">⏰ '+PROD[q.kind]+' 기간이 <b>'+mdw(q.end)+'</b>에 끝납니다('+(n===1?'오늘까지':n+'일 남음')+'). 계속 이용하시려면 관리자에게 연장을 문의하십시오. ('+ASK_WHERE+')</div>';
}
function prodLeftText(p){return "총 "+p.total+"시간 중 "+p.left.total+"시간 남음"}
function prodLine(q){
  const t=seoulDate(),pre=q.start>t?' · <b>시작 예정</b>':'';
  return q.start+' ~ '+q.end+pre+' · 총 '+q.total+'시간 · 남은 '+q.left.total+'시간';
}
/* 서버가 주는 상품 목록(033부터 목록, 그 전 응답이면 product 하나). 정액권은 noFlat이 미리 버리므로 이용권만 남음 */
function prodsOf(r){if(!r)return [];if(Array.isArray(r.products))return r.products;if(Array.isArray(r.currents))return r.currents;const p=r.product||r.current;return p?[p]:[]}
function stLabel(s){return s==="cancelled"?"취소":"확정"}

function slotCell(s,nameText){
  let cls="free",txt="예약 가능",dis="";
  if(s.blocked){cls="blocked";txt="이용 불가";dis="disabled"}
  else if(s.taken){cls="taken "+(s.ext?"ext":"stu");txt=esc(nameText)+(s.prod==="count"?'<i class="badge count">'+PROD.count+'</i>':"");dis="disabled"}
  else if(s.past){cls="past";txt="";dis="disabled"}
  return '<button class="slot '+cls+'" data-h="'+s.hour+'" '+dis+'><b>'+hourLabel(s.hour)+'</b><span>'+txt+'</span></button>';
}
function renderBook(){
  const dates=allowedDates();
  if(!dates.includes(curDate))curDate=dates[0];
  $("#dayTabs").innerHTML=dates.map((d,i)=>'<button class="tab'+(i?' tmr':'')+'" role="tab" data-d="'+d+'" aria-selected="'+(d===curDate)+'">'+(i?"내일":"오늘")+'<small>'+dateLabel(d)+'</small></button>').join("");
  $("#v-book").classList.toggle("tmr",curDate===dates[1]); // 내일을 보는 동안 시간표를 내일 색으로
  document.querySelectorAll("#dayTabs .tab").forEach(t=>t.onclick=()=>{curDate=t.dataset.d;renderBook()});
  if(!board){$("#grid").innerHTML='<p class="hint">예약 현황을 불러오는 중입니다…</p>';$("#grid2").innerHTML="";return}
  const cells=slotsFor(curDate).map(s=>slotCell(s,s.masked));
  $("#grid").innerHTML=cells.slice(0,12).join("");$("#grid2").innerHTML=cells.slice(12).join("");
  document.querySelectorAll("#grid .slot.free, #grid2 .slot.free").forEach(b=>{b.onclick=()=>selectSlot(+b.dataset.h);if(selDate===curDate&&+b.dataset.h===selHour){b.classList.add("sel");b.querySelector("span").textContent="선택됨"}});
  updateBar();
}

function stuCheckHtml(r,D){
  if(!r)return"";

  const has=prodsOf(r).some(p=>p.start<=D&&D<=p.end); // 이용권이 있는 등록 재원생은 명부 예외(v0.38.0, 서버 030)
  if(r.roster||has)return'<div class="stuchk ok"><span class="ic" aria-hidden="true">✓</span><span><b>재원생입니다.</b> 예약하실 수 있습니다.</span></div>';
  return'<div class="stuchk no"><span class="ic" aria-hidden="true">!</span><span><b>재원생 명부에서 확인되지 않습니다.</b> 이름과 비밀번호를 다시 확인하십시오. 계속 안 되면 학원으로 문의하십시오. ('+ASK_WHERE+')</span></div>';
}

  let bt=null,bseq=0;

function whoInfo(u,D){

  return '<b style="color:var('+(u.type==="ext"?'--ext-text':'--stu-text')+')">'+tgtLabel(u.type)+'</b> '+
    (ps.length?ps.map(p=>'<i class="badge '+p.kind+'" style="margin-left:0">'+PROD[p.kind]+'</i> '+prodLeftText(p)).join(' · ')
      :'일반 · '+(u.type==="stu"?'하루 1시간'+(u.day_taken?' (이 날 예약 있음)':''):'시간 제한 없음'));

function histHtml(resList,oldProds){

  return '<p class="hint" style="margin-top:14px">예약 기록과 만료된 이용권은 '+KEEP_DAYS+'일 동안 보관된 뒤 삭제됩니다.</p>'+
    '<details class="hist"><summary>예약 기록 <small>'+rs.length+'건</small></summary><p class="hint" style="margin:8px 0 4px">최근 '+KEEP_DAYS+'일 안의 예약만 볼 수 있습니다.</p>'+(rItems||'<p class="hint">예약 기록이 없습니다.</p>')+'</details>'+
    '<details class="hist"><summary>만료된 이용권 <small>'+ps.length+'건</small></summary>'+(pItems||'<p class="hint">만료된 이용권이 없습니다.</p>')+'</details>';
}

  // 보이는 부분 = 이 화면 중에서 바깥 페이지의 화면에 실제로 보이는 영역(1% 단위로 갱신)
  new IntersectionObserver(es=>{const e=es[es.length-1];visRect=e.isIntersecting&&e.intersectionRect.height>120?e.intersectionRect:null},
    {threshold:Array.from({length:101},(_,i)=>i/100)}).observe(document.body);

/* 바깥 페이지(아임웹 코드)가 스크롤할 때마다 "이 칸이 화면의 어디에 있는지"(칸 위쪽 위치, 화면 높이)를 알려 줍니다.
   이 값이 있으면 그것으로, 없으면(옛 아임웹 코드) 위의 보이는 부분 계산으로 창을 화면 가운데에 맞춥니다. */
let parentView=null;
window.addEventListener("message",e=>{
  const d=e.data;
  if(e.source!==window.parent||!d||d.type!=="drum-room-view"||typeof d.top!=="number"||typeof d.vh!=="number")return;
  parentView={top:d.top,vh:d.vh};placeSheet(wantFit);wantFit=false;
});
let wantFit=false; // 창이 열리거나 내용이 바뀐 직후 한 번: 보이는 칸이 창보다 작으면 바깥 페이지를 조금 스크롤해 달라고 함
function askView(){if(EMBED){wantFit=true;try{parent.postMessage({type:"drum-room-ask"},"*")}catch(e){}}}
function placeSheet(fit){
  if(!EMBED||!$("#bg").classList.contains("open"))return;
  const sh=$("#sheet"),vh=window.innerHeight;
  let top0,h0;
  if(parentView){ // 바깥 화면에 보이는 부분 = 칸 안 좌표로 [-칸위쪽, 바깥화면높이-칸위쪽]
    top0=Math.max(0,-parentView.top);h0=Math.min(vh,parentView.vh-parentView.top)-top0;
  }
  if(!parentView||h0<120){
    top0=visRect?visRect.top:Math.max(0,(lastTapY==null?vh/2:lastTapY)-300);h0=visRect?visRect.height:Math.min(640,vh);
  }
  sh.style.maxHeight=Math.max(240,Math.min(h0-24,720))+"px";

  if(fit===true&&parentView&&h0<H+24){try{parent.postMessage({type:"drum-room-need",height:H+24},"*")}catch(e){}}
  let top=Math.round(top0+(h0-H)/2);top=Math.max(8,Math.min(top,vh-H-8));

/* 바깥 페이지(아임웹)에 이 화면의 실제 길이를 알려 줍니다. 바깥 페이지의 스크립트가 칸 높이를 여기에 맞춥니다(아래 여백 없앰).

const DAY7=["월","화","수","목","금","토","일"];
function hmKo(v){const [h,m]=String(v).split(":").map(Number);if(h===24||(h===0&&m===0))return "자정";return (h<12?"오전 ":"오후 ")+(h%12===0?12:h%12)+"시"+(m?" "+m+"분":"")}

  if(d.every(x=>key(x)===key(d[0])))return [["매일",txt(d[0])]];
  const out=[];let i=0;
  while(i<7){let j=i;while(j+1<7&&key(d[j+1])===key(d[i]))j++;out.push([DAY7[i]+(j>i?(j===i+1?"·":"~")+DAY7[j]:""),txt(d[i])]);i=j+1}

}

const EXTREG_MARK=/^\{\s*일반회원\s*등록하기\s*\}$/; // 이 줄만 있으면 [일반회원 등록하기] 버튼(v0.51.5)

function infoBodyCore(ls){

    let h="",li=[],tag="";const flush=()=>{if(li.length){h+='<'+tag+'>'+li.map(x=>'<li>'+infoInline(x)+'</li>').join("")+'</'+tag+'>';li=[]}};
    ls.forEach(x=>{const t=/^-\s/.test(x)?"ul":num(x)?"ol":"";if(t&&t!==tag)flush();if(t){tag=t;li.push(x.replace(/^(-|\d+[.)])\s*/,""))}else{flush();tag="";h+='<p style="margin:6px 0 0">'+infoInline(x)+'</p>'}});flush();return h;

}

  const tap=(el,fn)=>{let t=0;el.onpointerup=e=>{e.stopPropagation();t=Date.now();fn()};el.onclick=e=>{e.stopPropagation();if(Date.now()-t>600)fn()}};
  tap(box.querySelector(".lbx"),close);tap(box.querySelector(".lbp"),()=>go(-1));tap(box.querySelector(".lbn"),()=>go(1));

// 사진 줄이기: 긴 쪽 1280px, JPEG(약 200KB). 2MB가 넘으면 화질을 낮춰 다시
async function shrinkPhoto(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error("load"));i.src=url});
    const m=1280,r=Math.min(1,m/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*r),h=Math.round(img.naturalHeight*r);
    const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);
    for(const q of [0.82,0.7,0.55]){const b=await new Promise(ok=>c.toBlob(ok,"image/jpeg",q));if(b&&b.size<1.9*1024*1024)return b}
    return null;
  }finally{URL.revokeObjectURL(url)}
}

async function reloadAdmin(){

  const k=days/30,won=v=>Number(v).toLocaleString("ko-KR")+"원";
  return '<span class="pc-l">가격표 기준</span> <b>'+won(+hit.price*k)+'</b>'+(k>1?' <span class="pc-no">('+won(hit.price)+' × '+k+')</span>':'');

// 캡처 단계로 들음: 코드에서 보내는 input/change(버블 없음, 예: 가격표에서 고르기)도 받기 위해
["input","change"].forEach(t=>document.addEventListener(t,e=>{if(e.target.closest&&e.target.closest("#adminPane"))setTimeout(updPrices,0)},true));
/* 전화번호 칸(.phone)은 숫자만 입력(하이픈 등은 바로 지움, 11자리까지)(v0.38.11). maxlength를 두지 않아 "010-1234-5678"을 붙여 넣어도 잘리지 않고 숫자 11자리가 남음(v0.38.12). 보여 줄 때는 010-0000-0000(서버 저장 값·fmtPhone) */
document.addEventListener("input",e=>{const el=e.target;if(!el.classList||!el.classList.contains("phone"))return;let d=el.value.replace(/\D/g,"");if(/^821/.test(d))d="0"+d.slice(2);d=d.slice(0,11);if(d!==el.value)el.value=d},true); // +82 10-… 붙여넣기 → 010…
/* 금액 칸(.pp: 1시간 이용료·이용료 표 가격)은 입력하는 동안 1,000 단위 쉼표를 붙임(v0.38.10). 숫자만 남기고 커서는 같은 숫자 뒤에 둠.
   서버는 쉼표·"원"을 빼고 저장하므로 저장 값은 그대로 숫자. */
document.addEventListener("input",e=>{
  const el=e.target;if(!el.classList||!el.classList.contains("pp"))return;
  const pos=el.selectionStart||0,before=el.value.slice(0,pos).replace(/\D/g,"").length;
  const d=el.value.replace(/\D/g,"").replace(/^0+(?=\d)/,"");
  const f=d?Number(d).toLocaleString("ko-KR"):"";
  if(f===el.value)return;
  el.value=f;let i=0,c=0;while(i<f.length&&c<before){if(/\d/.test(f[i]))c++;i++}
  try{el.setSelectionRange(i,i)}catch(_){}
},true);
function bindPeriod(p){loadPriceCache();const updEnd=()=>{const s=$("#"+p+"Start").value,d=daysVal(p+"Days");$("#"+p+"End").textContent=s&&d?periodText(s,d):"";updPrices()};$("#"+p+"Start").oninput=updEnd;$("#"+p+"Days").oninput=updEnd;updEnd();return updEnd}
function readPeriod(p){const start=$("#"+p+"Start").value,days=daysVal(p+"Days");return start&&days?{start,days}:{err:"시작일과 기간(일)을 확인하십시오. 기간은 1 이상의 숫자로 입력하십시오."}}
/* 이용권 새로 추가하는 칸의 동작(v0.40.0부터 칸은 kindSlotHtml이 그림). */
function bindNewProd(p,isExt){
  const sync=()=>{
    const ko=$("#"+p+"Kind");
    $("#"+p+"Prod").classList.toggle("hidden",ko.value==="none");
    if(ko.value!=="none"&&$("#"+p+"Qty").dataset.k!==ko.value){$("#"+p+"Qty").innerHTML=qtyCtl(p,ko.value);$("#"+p+"Qty").dataset.k=ko.value}
    const pb=document.querySelector('[data-priceref="'+p+'"]');if(pb){pb.disabled=ko.value==="none";pb.title=pb.disabled?"종류를 먼저 고르십시오":""} // [가격표]는 종류를 고른 뒤에(v0.34.0)
  };
  $("#"+p+"Kind").onchange=sync;bindPeriod(p);sync();

function readNewProd(p){ // {kind:"none"} 또는 {kind,start,days,limit,total} 또는 {err}
  const kind=$("#"+p+"Kind").value;if(kind==="none")return {kind};
  let limit=null,total=null;
  const tr=totRead(p);if(!tr.ok)return {err:tr.msg};total=tr.total;
  const pr=readPeriod(p);if(pr.err)return pr;
  return {kind,start:pr.start,days:pr.days,limit,total};
}

/* 이용권 칸(v0.40.0의 정액권 칸은 v0.53.0에서 없어짐). 이용자 등록·이용자 수정이 같은 함수로 그립니다(작업 원칙 10).

function kindSlotHtml(p,kind,cur,last){

    body=(cur.start>seoulDate()?'<p class="hint" style="margin:0">시작 예정</p>':'')+

      '<div id="'+pp+'Prod" class="hidden">'+prodPeriodFields(pp,seoulDate(),PERIOD_DAYS)+'</div>';
  }

}
function bindKindSlot(p,kind,cur,onStop){ // 돌려주는 함수: 구분이 바뀌었을 때 다시 그리기(새 상품 칸만)
  const pp=p+"C";
  if(!cur)return bindNewProd(pp);
  bindPeriod(pp);
  $("#"+pp+"Stop").onclick=()=>onStop(cur);
  return null;
}
function readKindSlot(p,kind,cur){ // null(없음) 또는 {err} 또는 서버에 보낼 {id?,kind,start,days,limit,total}
  const pp=p+"C";
  if(!cur){const np=readNewProd(pp);if(np.err)return np;return np.kind==="none"?null:{kind:np.kind,start:np.start,days:np.days,limit:np.limit,total:np.total}}
  const pr=readPeriod(pp);if(pr.err)return pr;
  const it={id:cur.id,kind:"count",start:pr.start,days:pr.days};
  const tr=totRead(pp);if(!tr.ok)return {err:tr.msg};it.total=tr.total;
  return it;
}

function a4Fit(el){ // 한 장을 넘치면 글자·줄 간격을 조금씩 줄임(15px부터 7px까지)

  while(f>7&&el.scrollHeight>el.clientHeight+1){f-=.5;el.style.fontSize=f+"px"}
  return f;
}

async function a4SaveImage(btn,msgEl,wantStu){ // 이미지로 저장(v0.50.0, v0.50.3부터 이용료 변경의 [가격표] 상자에서): 저장된 이용료로 A4 한 장 PNG(1588×2246)

    const box=document.createElement("div");box.style.cssText="position:fixed;left:-10000px;top:0;width:210mm;background:#fff";
    box.innerHTML=a4Html(P,null,o);document.body.appendChild(box);

    else{const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
    msg('<div class="msg ok">이미지를 만들었습니다. 내려받은 파일(휴대폰은 사진첩)을 확인하십시오.</div>');
  }catch(e){console.error(e);msg('<div class="msg err">이미지를 만들지 못했습니다. 인터넷 연결을 확인하시거나, [A4 가격표 만들기·인쇄] → [인쇄하기]에서 [PDF로 저장]을 쓰십시오.</div>')}

function rosterTime(t){try{return new Date(t).toLocaleString("ko-KR",{timeZone:"Asia/Seoul",month:"long",day:"numeric",hour:"2-digit",minute:"2-digit"})}catch(e){return t}}
function rosterHtml(){
  const R=A.roster;if(!R)return '<p class="hint">불러오는 중입니다…</p>';
  if(!R.ok)return '<div class="msg err">명부 연동 정보를 불러오지 못했습니다. Supabase에 025를 실행했는지 확인하십시오.'+(R.msg?' ('+esc(R.msg)+')':'')+'</div>';
  const pb=k=>k==="count"?'<span class="badge count">'+PROD.count+'</span>':'';
  return (uFlash?'<div class="msg ok">'+esc(uFlash)+'</div>':'')+
   '<div class="card"><div class="part" style="margin-top:0">명부 상태</div>'+
     '<p style="margin:0 0 6px">마지막 반영: <b>'+(R.synced_at?esc(rosterTime(R.synced_at)):'아직 반영된 적이 없습니다')+'</b> · 명부 <b>'+R.count+'명</b></p>'+
     '<p style="margin:0 0 10px">명부 확인: <b style="color:var('+(R.check?'--stu-text':'--danger')+')">'+(R.check?'켜짐':'꺼짐')+'</b></p>'+
     '<button class="btn'+(R.check?' ghost':'')+'" id="rcToggle">'+(R.check?'명부 확인 끄기':'명부 확인 켜기')+'</button>'+
     '<p class="hint">켜면 재원생 예약하기는 명부에 있는 학생(이름 + 전화번호 뒤 4자리)만 할 수 있습니다. 이용권 기간이 남은 등록 재원생은 명부에 없어도 예약할 수 있습니다. 관리자 예약은 명부를 보지 않습니다.</p></div>'+
   '<div class="card"><div class="part" style="margin-top:0">연동 열쇠</div>'+
     '<p style="margin:0 0 8px">'+(R.has_token?'열쇠가 만들어져 있습니다.':'아직 열쇠가 없습니다.')+'</p><div id="rtkOut"></div>'+
     '<button class="btn ghost" id="rtkNew">'+(R.has_token?'새 열쇠 만들기':'열쇠 만들기')+'</button>'+
     '<p class="hint">만든 열쇠는 한 번만 보입니다. 구글 시트 메뉴 [예약 명부 → 연동 열쇠 넣기]에 붙여 넣으십시오. 새로 만들면 전에 넣은 열쇠는 더 이상 쓸 수 없습니다.</p></div>'+
   '<div class="card"><div class="part" style="margin-top:0">명부와 연결되지 않은 재원생 <small>'+R.unlinked.length+'명</small></div>'+
     (R.unlinked.length?R.unlinked.map(x=>'<div class="item"><div class="row"><div><b style="color:var(--stu-text)">'+esc(x.name)+'</b>'+pb(x.prod)+'<div class="hint" style="margin:0">'+(x.in_roster?'명부에 같은 이름이 있습니다':'명부에 같은 이름이 없습니다')+'</div></div>'+(x.in_roster?'<button class="btn small" data-rlink="'+x.id+'" data-rname="'+esc(x.name)+'">명부와 연결</button>':'')+'</div></div>').join(""):'<p class="hint">모든 등록 재원생이 명부와 연결되어 있습니다.</p>')+
     '<p class="hint">연결하면 그 학생의 비밀번호가 명부의 전화번호 뒤 4자리로 바뀝니다. 명부에 이름이 없으면 시트의 이름과 같게 이용자 수정에서 고친 뒤 연결하십시오.</p></div>'+
   (R.gone.length?'<div class="card"><div class="part" style="margin-top:0">명부에서 빠진 연결 재원생 <small>'+R.gone.length+'명</small></div>'+
     R.gone.map(x=>'<div class="item"><b style="color:var(--stu-text)">'+esc(x.name)+'</b>'+pb(x.prod)+'<div class="hint" style="margin:0">등록번호 '+esc(x.no)+(x.prod==="count"?' · 이용권 기간 동안은 예약할 수 있습니다':' · 재원생 예약을 할 수 없습니다')+'</div></div>').join("")+'</div>':'')+
   '<div style="font-size:12px;color:var(--sub);line-height:1.7;margin:12px 4px 0"><b>처음 설정 순서</b><ol style="margin:2px 0 0;padding-left:18px"><li>[열쇠 만들기]로 열쇠를 만들어 복사합니다.</li><li>구글 시트 [확장 프로그램 → Apps Script]에 명부 보내기 코드를 붙여 넣습니다.</li><li>시트 메뉴 [예약 명부 → 연동 열쇠 넣기]에 열쇠를 붙여 넣습니다.</li><li>[예약 명부 → 지금 반영]을 누르고 이 화면의 인원 수를 확인합니다.</li><li>[예약 명부 → 1시간마다 자동 반영 켜기]를 누르고, 이 화면에서 [명부 확인 켜기]를 누릅니다.</li></ol></div>';
}
function bindRosterPage(){
  if(!$("#rcToggle"))return;
  const after=async msg=>{uFlash=msg||"";await reloadAdmin();renderAdmin()};
  $("#rcToggle").onclick=async()=>{
    const on=!A.roster.check;
    if(on&&!confirm("명부 확인을 켜시겠습니까?\n켜면 명부에 없는 이름으로는 재원생 예약을 할 수 없습니다."))return;
    $("#rcToggle").disabled=true;const r=await rpc("admin_set_roster_check",{p_on:on});
    if(r.auth){adminExpired();return}
    if(!r.ok){$("#rcToggle").disabled=false;alert(r.msg);return}
    after(on?"명부 확인을 켰습니다.":"명부 확인을 껐습니다.");
  };
  $("#rtkNew").onclick=async()=>{
    if(A.roster.has_token&&!confirm("새 열쇠를 만들면 지금 시트에 넣어 둔 열쇠는 더 이상 쓸 수 없습니다. 만드시겠습니까?"))return;
    $("#rtkNew").disabled=true;const r=await rpc("admin_roster_token");$("#rtkNew").disabled=false;
    if(r.auth){adminExpired();return}
    if(!r.ok){alert(r.msg);return}
    A.roster.has_token=true;
    $("#rtkOut").innerHTML='<div class="msg warn" style="margin:0 0 6px">이 열쇠는 지금 한 번만 보입니다. 복사해서 구글 시트에 붙여 넣으십시오.</div><div class="tokenbox" id="rtkVal">'+esc(r.token)+'</div><button class="btn small" id="rtkCopy">열쇠 복사</button>';
    $("#rtkCopy").onclick=async()=>{const ok=await copyText(r.token);$("#rtkCopy").textContent=ok?"복사했습니다":"복사 실패"};
  };
  document.querySelectorAll("[data-rlink]").forEach(b=>b.onclick=async()=>{
    const f=await rpc("admin_roster_find",{p_name:b.dataset.rname});
    if(f.auth){adminExpired();return}
    const rows=(f.rows||[]).filter(x=>!x.linked);
    if(!rows.length){alert("연결할 수 있는 명부 학생이 없습니다(이미 다른 이용자와 연결됨).");return}
    let no=rows[0].no;
    if(rows.length>1){no=prompt(b.dataset.rname+" 학생이 명부에 "+rows.length+"명 있습니다. 연결할 등록번호를 입력하십시오.\n("+rows.map(x=>x.no).join(", ")+")","");if(!no)return;no=no.trim()}
    else if(!confirm(b.dataset.rname+"님을 명부(등록번호 "+no+")와 연결하시겠습니까?\n비밀번호가 명부의 전화번호 뒤 4자리로 바뀝니다."))return;
    b.disabled=true;const r=await rpc("admin_link_roster",{p_user_id:+b.dataset.rlink,p_no:no});
    if(r.auth){adminExpired();return}
    if(!r.ok){b.disabled=false;alert(r.msg);return}
    after(b.dataset.rname+"님을 명부와 연결했습니다.");
  });
}
function bindPay(){
  if(!$("#paGo"))return;
  $("#paGo").onclick=async()=>{
    const p={};["bank","holder","number"].forEach(k=>p[k]=$("#pa_"+k).value); // 이용료는 설정 > 이용료 변경에서 따로 저장(v0.25.0, 서버 021부터 계좌 저장 때 이용료 유지)
    $("#paGo").disabled=true;const r=await rpc("admin_set_pay",{p});if($("#paGo"))$("#paGo").disabled=false;
    if(r.auth){adminExpired();return}
    if(!r.ok){$("#paMsg").innerHTML='<div class="msg err">'+esc(r.msg)+'</div>';return}
    A.pay=r;["bank","holder","number"].forEach(k=>$("#pa_"+k).value=r[k]);
    $("#paMsg").innerHTML='<div class="msg ok">입금 계좌를 저장하였습니다.</div>';
  };
}
/* 설정 > 홈 화면 안내 > 문의 가능 시간(v0.44.0, 서버 042): 요일마다 [문의 가능] + 시작·끝(30분 단위) + 메모. 저장하면 [관리자 문의] 창에 바로 반영 */
function contactHtml(){
  if(A.contact===false)return '<div class="msg err">불러오지 못했습니다. Supabase에 042를 실행했는지 확인하십시오.</div>';
  if(!A.contact)return '<p class="hint">불러오는 중입니다…</p>';
  const H=A.contact,d=Array.isArray(H.days)&&H.days.length===7?H.days:DAY7.map(()=>({on:true,start:"09:00",end:"22:00"}));
  const T=[];for(let m=0;m<=1440;m+=30)T.push(String(Math.floor(m/60)).padStart(2,"0")+":"+(m%60?"30":"00"));
  const sel=(id,v,list)=>'<select id="'+id+'" aria-label="'+id+'">'+list.map(t=>'<option value="'+t+'"'+(t===v?' selected':'')+'>'+(t==="00:00"?"오전 0시":hmKo(t).replace(/시 30분$/,":30"))+'</option>').join("")+'</select>';
  return '<div class="card"><p class="hint" style="margin-top:0">손님 화면 맨 아래 [관리자 문의] 창에 보입니다. 지금이 문의 가능 시간이 아니면 손님에게 빨간 안내가 나오고, 전화 걸기 전에 한 번 더 묻습니다.</p>'+
    d.map((x,i)=>'<div class="chrow" data-ci="'+i+'"><label><input type="checkbox" class="chon"'+(x.on?' checked':'')+'>'+DAY7[i]+'</label>'+
      sel("ch_s"+i,x.start||"09:00",T.slice(0,-1))+'<span>~</span>'+sel("ch_e"+i,x.end||"22:00",T.slice(1))+'</div>').join("")+
    '<button type="button" class="btn ghost small" id="chCopy" style="margin-top:8px">월요일 시간을 모든 요일에 똑같이</button>'+
    '<label for="chMemo">메모 (선택, 100자까지)</label><input type="text" id="chMemo" maxlength="100" autocomplete="off" placeholder="예: 공휴일은 문의를 받지 않습니다." value="'+esc(H.memo||"")+'">'+
    '<div class="part" style="margin-top:16px">손님 화면에 보이는 모습</div><div id="chPrev"></div>'+
    (priceDate(H.updated_at)?'<p class="cdate">🗓 마지막 수정: <b>'+priceDate(H.updated_at)+'</b></p>':'')+
    '<div id="chMsg"></div><button class="btn" id="chGo">저장</button></div>'+
    // 문의 안 받는 기간(예외, v0.45.0): 추가·삭제는 바로 저장됨
    '<div class="card"><div class="part" style="margin-top:0">문의 안 받는 기간 (예외)</div><p class="hint" style="margin-top:0">휴가 등으로 위 시간이라도 연락을 받지 못하는 기간입니다. 이 기간에는 손님 화면에 "지금은 문의를 받지 않는 기간입니다"가 나오고, 사유도 손님에게 보입니다. 기간이 지나면 저절로 사라집니다.</p>'+
    '<div class="cols" style="grid-template-columns:1.4fr 1fr"><div><label for="coSD">시작 날짜</label><input type="date" id="coSD" value="'+seoulDate()+'" min="'+seoulDate()+'"></div><div><label for="coST">시작 시각</label>'+sel("coST","00:00",T.slice(0,-1))+'</div></div>'+
    '<div class="cols" style="grid-template-columns:1.4fr 1fr"><div><label for="coED">끝 날짜</label><input type="date" id="coED" value="'+seoulDate()+'" min="'+seoulDate()+'"></div><div><label for="coET">끝 시각</label>'+sel("coET","24:00",T.slice(1))+'</div></div>'+
    '<p class="hint" id="coPrev" style="margin:6px 0 0"></p>'+
    '<label for="coR">사유 (선택, 60자까지)</label><input type="text" id="coR" maxlength="60" autocomplete="off" placeholder="예: 휴가">'+
    '<div id="coMsg"></div><div id="coBtns"><button class="btn" id="coGo">예외 추가</button></div>'+
    (Array.isArray(H.off)&&H.off.length?'<div class="part">넣어 둔 예외</div>'+H.off.map(o=>'<div class="item"><div class="row"><div><b>'+offRange(o)+'</b><div class="hint" style="margin:0">'+esc(o.reason||"사유 없음")+'</div></div><div style="display:flex;gap:6px;flex:none"><button class="btn edit small" data-coe="'+esc(o.id)+'">수정</button><button class="btn danger small" data-cod="'+esc(o.id)+'">삭제</button></div></div></div>').join(""):'<p class="hint">넣어 둔 예외가 없습니다.</p>')+'</div>';
}
function bindContact(){
  if(!$("#chGo"))return;
  const read=()=>({days:DAY7.map((_,i)=>({on:$('[data-ci="'+i+'"] .chon').checked,start:$("#ch_s"+i).value,end:$("#ch_e"+i).value})),memo:$("#chMemo").value.trim()});
  const paint=()=>{const p=read();DAY7.forEach((_,i)=>{const on=p.days[i].on;$("#ch_s"+i).disabled=!on;$("#ch_e"+i).disabled=!on});$("#chPrev").innerHTML='<div class="card" style="margin:6px 0 0">'+hoursHtml({...p,off:(A.contact&&A.contact.off)||[]})+'</div>'};
  document.querySelectorAll(".chrow input,.chrow select,#chMemo").forEach(el=>{el.onchange=paint;el.oninput=paint});
  $("#chCopy").onclick=()=>{const on=$('[data-ci="0"] .chon').checked,a=$("#ch_s0").value,b=$("#ch_e0").value;DAY7.forEach((_,i)=>{$('[data-ci="'+i+'"] .chon').checked=on;$("#ch_s"+i).value=a;$("#ch_e"+i).value=b});paint()};
  paint();
  // 예외 칸: 끝 시각 24:00은 다음 날 00:00으로 바꿔 보냄
  const coRead=()=>{const sd=$("#coSD").value,ed=$("#coED").value,st=$("#coST").value,et=$("#coET").value;if(!sd||!ed)return null;
    return {from:sd+" "+st,to:et==="24:00"?addDays(ed,1)+" 00:00":ed+" "+et}};
  const coUpd=()=>{const v=coRead();$("#coPrev").textContent=v&&v.to>v.from?"→ "+offRange(v)+"까지 문의를 받지 않습니다.":v?"끝 날짜·시각은 시작보다 늦어야 합니다.":""};
  ["#coSD","#coST","#coED","#coET"].forEach(q=>{$(q).oninput=coUpd;$(q).onchange=coUpd});
  $("#coSD").onchange=()=>{if($("#coED").value<$("#coSD").value)$("#coED").value=$("#coSD").value;coUpd()};
  coUpd();
  const coAfter=(r,msg)=>{if(r.auth){adminExpired();return}if(!r.ok){$("#coMsg").innerHTML='<div class="msg err">'+esc(r.msg||NET_MSG)+'</div>';return}A.contact=r.hours;renderAdmin();if($("#coMsg"))$("#coMsg").innerHTML='<div class="msg ok">'+msg+'</div>'};
  // 예외 수정(v0.45.1, 서버 044): [수정]을 누르면 위 칸에 그 예외를 채우고, 버튼이 [예외 수정 저장]·[수정 취소]로 바뀜
  let coEdit=null;
  const coMode=id=>{coEdit=id;$("#coBtns").innerHTML=id?'<div class="btn2"><button class="btn edit" id="coGo">예외 수정 저장</button><button class="btn ghost" id="coCancel">수정 취소</button></div>':'<button class="btn" id="coGo">예외 추가</button>';
    $("#coGo").onclick=coSave;if(id)$("#coCancel").onclick=()=>{renderAdmin()};
    document.querySelectorAll("[data-coe]").forEach(b=>b.closest(".item").style.outline=b.dataset.coe===id?"2px solid var(--accent-strong)":"")};
  const coSave=async()=>{const v=coRead();if(!v||v.to<=v.from){$("#coMsg").innerHTML='<div class="msg err">끝 날짜·시각은 시작보다 늦어야 합니다.</div>';return}
    $("#coGo").disabled=true;const r=coEdit?await rpc("admin_edit_contact_off",{p_id:coEdit,p_from:v.from,p_to:v.to,p_reason:$("#coR").value.trim()}):await rpc("admin_add_contact_off",{p_from:v.from,p_to:v.to,p_reason:$("#coR").value.trim()});if($("#coGo"))$("#coGo").disabled=false;
    coAfter(r,coEdit?"예외를 수정하였습니다. 손님 화면에 바로 반영됩니다.":"예외를 추가하였습니다. 손님 화면에 바로 반영됩니다.")};
  $("#coGo").onclick=coSave;
  document.querySelectorAll("[data-coe]").forEach(b=>b.onclick=()=>{const o=(A.contact.off||[]).find(x=>x.id===b.dataset.coe);if(!o)return;
    const ed=o.to.slice(11,16)==="00:00"?addDays(o.to.slice(0,10),-1):o.to.slice(0,10),et=o.to.slice(11,16)==="00:00"?"24:00":o.to.slice(11,16);
    $("#coSD").min="";$("#coED").min="";$("#coSD").value=o.from.slice(0,10);$("#coST").value=o.from.slice(11,16);$("#coED").value=ed;$("#coET").value=et;$("#coR").value=o.reason||"";
    $("#coMsg").innerHTML='<div class="msg">위 칸에서 고친 뒤 [예외 수정 저장]을 누르십시오.</div>';coMode(o.id);coUpd();$("#coSD").scrollIntoView({block:"center"})});
  document.querySelectorAll("[data-cod]").forEach(b=>b.onclick=async()=>{if(!confirm("이 예외를 삭제하시겠습니까?"))return;const r=await rpc("admin_del_contact_off",{p_id:b.dataset.cod});coAfter(r,"예외를 삭제하였습니다.")});
  $("#chGo").onclick=async()=>{
    const p=read(),bad=p.days.findIndex(x=>x.on&&x.end<=x.start);
    if(bad>=0){$("#chMsg").innerHTML='<div class="msg err">'+DAY7[bad]+'요일 끝 시각은 시작 시각보다 늦어야 합니다.</div>';return}
    $("#chGo").disabled=true;const r=await rpc("admin_set_contact_hours",{p});if($("#chGo"))$("#chGo").disabled=false;
    if(r.auth){adminExpired();return}
    if(!r.ok){$("#chMsg").innerHTML='<div class="msg err">'+esc(r.msg||NET_MSG)+'</div>';return}
    A.contact=r.hours;renderAdmin();
    if($("#chMsg"))$("#chMsg").innerHTML='<div class="msg ok">문의 가능 시간을 저장하였습니다. 손님 화면에 바로 반영됩니다.</div>';
  };
}
function bindDoor(){

    const p={};DOOR_LABELS.forEach(([k])=>p[k]=$("#d_"+k).value);
    $("#dGo").disabled=true;const r=await rpc("admin_set_door_codes",{p});if($("#dGo"))$("#dGo").disabled=false;

function bindBlock2(){
  const pad=n=>String(n).padStart(2,"0");
  const read=()=>({sd:$("#bSD").value,sh:Number($("#bSH").value),ed:$("#bED").value,eh:Number($("#bEH").value)});
  const valid=v=>v.sd&&v.ed&&Number.isInteger(v.sh)&&Number.isInteger(v.eh)&&v.sh>=0&&v.sh<=23&&v.eh>=0&&v.eh<=23&&(v.ed+pad(v.eh))>(v.sd+pad(v.sh));
  const upd=()=>{const v=read();$("#bPrev").textContent=valid(v)?dateLabel(v.sd)+" "+pad(v.sh)+":00 ~ "+dateLabel(v.ed)+" "+pad(v.eh)+":00":""};

    const args={p_sd:v.sd,p_sh:v.sh,p_ed:v.ed,p_eh:v.eh,p_reason:reason,p_confirm:false};
    $("#bGo").disabled=true;
    let r=await rpc("admin_block",args);
    if(r.need_confirm){
      const hits=r.hits||[];
      if(!confirm("이 기간에 예약이 "+hits.length+"건 있습니다: "+hits.map(x=>x.name+" "+x.date.slice(5)+" "+x.hour+"시").join(", ")+"\n모두 취소하고 이용 불가로 설정하시겠습니까?")){$("#bGo").disabled=false;return}
      r=await rpc("admin_block",{...args,p_confirm:true});
    }
    if($("#bGo"))$("#bGo").disabled=false;
    if(r.auth){adminExpired();return}
    if(!r.ok){err(r.msg);return}
    reloadAdmin();
  };
  document.querySelectorAll("[data-bd]").forEach(b=>b.onclick=async()=>{
    if(!confirm("이 이용 불가를 해제하시겠습니까?"))return;
    const r=await rpc("admin_unblock",{p_group:b.dataset.bd});
    if(r.auth){adminExpired();return}
    if(!r.ok){alert(r.msg);return}
    reloadAdmin();
  });
}

  const mv=(i,d)=>{A.infoSel={};const a=readInfoDraft(),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];A.infoDraft=a;A.infoMsg="";redraw()};

        unpaid=ended.filter(r=>payNeed(r)&&!r.pay_ok).reverse(),past=ended.filter(r=>!(payNeed(r)&&!r.pay_ok)).reverse(), // 입금 확인 안 된 지난 예약은 따로 모음(v0.39.0)
        canc=A.res.filter(r=>r.status==="cancelled").reverse();
  const wasOpen=id=>{const d=document.getElementById(id);return d&&d.open?" open":""}; // 자동 새로고침 때 펼친 상태 유지
  const fo=document.activeElement&&(histQ.hasOwnProperty(document.activeElement.id)||document.activeElement.id==="qUser"||document.activeElement.id==="qDorm"||document.activeElement.id==="qBlack")?document.activeElement.id:null; // 검색 칸에 입력 중이었으면 다시 커서를 둡니다
  $("#adminPane").innerHTML=
   '<div class="tabs" id="aTabs">'+tabBtns()+'</div>'+(A.err?'<div class="msg err">'+esc(A.err)+'</div>':'')+
   '<div id="sec-list"><div class="card"><div class="row"><b>예약 목록 (본명 표시)</b></div><div class="tbl">'+
   (up.length?up.map(resItem).join(""):'<p class="hint">예정된 예약이 없습니다.</p>')+'</div></div>'+
   // 입금 확인 안 된 예약(v0.39.0): 이용 시간이 지났는데(어제까지) 관리자가 아직 입금을 확인하지 않은 일반회원 예약. 확인하면 지난 예약으로
   '<details class="hist unpaidbox" id="hUnpaid"'+(document.getElementById("hUnpaid")?wasOpen("hUnpaid"):" open")+'><summary>입금 확인 안 된 예약 <small>'+unpaid.length+'건</small></summary>'+
   (unpaid.length?unpaid.map(resItem).join(""):'<p class="hint">입금 확인이 안 된 예약이 없습니다.</p>')+'</details>'+
   // 지난 예약·취소된 예약은 예약 목록 상자 밖에 따로 된 상자로(v0.21.6)
   '<p class="hint" style="margin-top:14px">지난 예약과 취소된 예약은 '+KEEP_DAYS+'일 동안 보관된 뒤 삭제됩니다.</p>'+
   '<details class="hist" id="hPast"'+wasOpen("hPast")+'><summary>지난 예약 <small>'+past.length+'건</small></summary><p class="hint" style="margin:8px 0 4px">최근 '+KEEP_DAYS+'일 안의 예약만 볼 수 있습니다.</p>'+histSearch("qPast")+dayGroups(past,false,"qPast")+'</details>'+
   '<details class="hist" id="hCanc"'+wasOpen("hCanc")+'><summary>취소된 예약 <small>'+canc.length+'건</small></summary><p class="hint" style="margin:8px 0 4px">최근 '+KEEP_DAYS+'일 안의 예약만 볼 수 있습니다.</p>'+histSearch("qCanc")+dayGroups(canc,true,"qCanc")+'</details>'+
   '</div><div id="sec-ext">'+userHtml()+'</div><div id="sec-proxy">'+proxyHtml()+'</div><div id="sec-block">'+settingsHtml()+'</div>'+
   '<div style="display:flex;justify-content:flex-end;margin-top:56px;padding-top:20px;border-top:1px solid var(--line)"><button class="btn danger small" id="out" style="padding:0 22px">로그아웃</button></div>';
  bindHist("qPast","#hPast");bindHist("qCanc","#hCanc");
  if(fo){const el=$("#"+fo);el.focus();el.setSelectionRange(el.value.length,el.value.length)}
  $("#out").onclick=async()=>{try{await sb.auth.signOut()}catch(e){}leaveAdmin()};
  document.querySelectorAll("[data-ac]").forEach(b=>b.onclick=async()=>{
    const reason=prompt("취소 사유를 입력하십시오 (예: 장비 점검)");
    if(reason===null)return;
    const r=await rpc("admin_cancel",{p_id:+b.dataset.ac,p_reason:reason});
    if(r.auth){adminExpired();return}
    if(!r.ok)alert(r.msg);
    reloadAdmin();refreshBook();
  });
  document.querySelectorAll("[data-pay]").forEach(b=>b.onclick=async()=>{
    const on=b.dataset.v==="1";
    if(!confirm(on?"입금 확인하시겠습니까?":"입금 확인을 취소하시겠습니까?"))return;
    b.disabled=true;
    const r=await rpc("admin_set_paid",{p_id:+b.dataset.pay,p_ok:on});
    if(r.auth){adminExpired();return}
    if(!r.ok){alert(r.msg||"입금 확인을 저장하지 못했습니다. Supabase에 032를 실행했는지 확인하십시오.");b.disabled=false;return}
    reloadAdmin();
  });
  bindUser();bindSettings();applyAdminTab();if(adminTab==="proxy")renderProxy();
}

/* 가격표만 보이는 페이지(v0.49.0): ?price 로 열면 예약 화면 대신 A4 가격표와 같은 모양(a4Html)을 화면 폭에 맞게 보여 줌.
   열 때와 5분마다 price_info를 새로 받아 와 관리자가 바꾼 가격이 반영됨. 다른 페이지 안(iframe)이면 높이를 바깥에 알림(drum-room-height). */
async function priceOnlyPaint(){
  const box=$("#priceOnly");if(!box)return;
  const P=await rpc("price_info");
  if(!P||!P.ok){if(!box.dataset.ok)box.innerHTML='<p class="hint" style="text-align:center">'+esc(NET_MSG)+'</p>';return}
  box.dataset.ok="1";
  const hasStu=(P.stu_count||[]).length||P.stu_extra;
  box.innerHTML=a4Html(P,null,{stu:!!hasStu}).replace('<div class="a4">','<div class="a4 web">').replace(/<\/div>$/,
    '<div class="pweb">예약·확인은 <a href="https://room.hyunmusic.com/" target="_top" rel="noopener">room.hyunmusic.com</a> 에서 하십시오.</div></div>');
  postHeight();
}
function priceOnlyInit(){
  document.body.classList.add("priceonly");document.title="(이용료) "+PAGE_TITLE;
  const d=document.createElement("div");d.id="priceOnly";d.innerHTML='<p class="hint" style="text-align:center">불러오는 중입니다…</p>';
  $(".wrap").appendChild(d);
  priceOnlyPaint();setInterval(priceOnlyPaint,5*60*1000);
}
/* ===== 시작 ===== */
$("#ver").textContent=APP_VERSION;
$("#addrCopy").onclick=async()=>{const b=$("#addrCopy"),ok=await copyText(b.dataset.addr);b.textContent=ok?"복사했습니다":"복사 실패";setTimeout(()=>{b.textContent="주소 복사"},2000)}; // 푸터 주소 복사(v0.40.6)
if(PRICE_ONLY)priceOnlyInit();else{renderBook();refreshBook()}
if(LOBBY&&!PRICE_ONLY)lobbyInit();
loadInfoSaved(); // 홈 화면 버튼에 바꾼 제목(v0.48.0)
if(location.hash==="#admin")go("admin"); // 관리자는 주소 끝에 #admin을 붙여 바로 들어올 수 있습니다.
/* 화면 안의 관리자 진입 버튼은 없음(v0.38.17). 주소창에 #admin을 붙이면 새로고침 없이도 관리자 화면으로 */
addEventListener("hashchange",()=>{if(location.hash==="#admin")go("admin")});
checkSession();
/* 자동 새로고침: 30초마다, 그리고 화면으로 돌아왔을 때 예약 현황(관리자는 예약 목록)을 다시 불러옵니다. 입력 창이 열려 있으면 건너뜁니다. */
function autoRefresh(){
  if(document.hidden||$("#bg").classList.contains("open"))return;
  if(!$("#v-book").classList.contains("hidden"))refreshBook();
  else if(adminOn&&!$("#v-admin").classList.contains("hidden")&&(adminTab==="list"&&setPage===null||adminTab==="proxy"))reloadAdmin();
}
setInterval(autoRefresh,30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)autoRefresh()});
</script>
<div id="a4print"></div>
</body>
</html>
